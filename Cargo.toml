[package]
name = "gilgamesh"
version = "0.1.0"
edition = "2021"
description = "Hardware-accurate spiking neural network implementation"

[features]
default = []
# BLAS acceleration (optional) - choose one based on platform
blas-accelerate = ["ndarray/blas", "dep:blas-src", "blas-src/accelerate"]  # macOS
blas-openblas = ["ndarray/blas", "dep:blas-src", "blas-src/openblas"]      # Linux

[dependencies]
# Linear algebra (BLAS optional via features)
ndarray = { version = "0.16", features = ["rayon"] }
ndarray-rand = "0.15"
blas-src = { version = "0.10", optional = true }

# Parallelism
rayon = "1.10"

# Random number generation
rand = "0.8"
rand_distr = "0.4"
rand_xoshiro = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI and utilities
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
indicatif = "0.17"

# MNIST data loading
mnist = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 2
